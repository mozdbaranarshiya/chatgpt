name: Apply robust edit unlimited patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/edit-unlimited-v6.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          zip_path = Path("v4.6.2.zip")
          tmp_zip = Path("v4.6.2.zip.tmp")
          patch = Path(".tmp/edit-unlimited-v6.js").read_text(encoding="utf-8").strip()
          marker = "/* === GPTYAR edit subscriber unlimited robust v6 === */"

          with ZipFile(zip_path, "r") as zin:
              matches = [
                  n for n in zin.namelist()
                  if n == "accupdator-manager.js"
                  or n.endswith("/accupdator-manager.js")
              ]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one accupdator-manager.js, found: {matches}")

              target = matches[0]
              js = zin.read(target).decode("utf-8")

              pos = js.find(marker)
              if pos >= 0:
                  js = js[:pos].rstrip()

              js += "\n\n" + patch + "\n"

              Path("/tmp/accupdator-manager.js").write_text(js, encoding="utf-8")

              with ZipFile(tmp_zip, "w") as zout:
                  for info in zin.infolist():
                      payload = js.encode("utf-8") if info.filename == target else zin.read(info.filename)
                      zout.writestr(info, payload)

          tmp_zip.replace(zip_path)
          print("Modified:", target)
          PY

      - name: Validate JS
        run: node --check /tmp/accupdator-manager.js

      - name: Commit ZIP
        shell: bash
        run: |
          if git diff --quiet -- v4.6.2.zip; then
            echo "No changes."
            exit 0
          fi
          git config user.name "GPT Yar Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add v4.6.2.zip
          git commit -m "Make unlimited edit control render reliably"
          git push
