name: Add unlimited option to edit subscription

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/edit-unlimited-v5.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch accupdator manager inside ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          zip_path = Path("v4.6.2.zip")
          tmp_zip = Path("v4.6.2.zip.tmp")
          patch = Path(".tmp/edit-unlimited-v5.js").read_text(encoding="utf-8").strip()
          marker = "/* === GPTYAR edit subscriber unlimited v5 === */"

          if not zip_path.exists():
              raise SystemExit("v4.6.2.zip not found")

          with ZipFile(zip_path, "r") as zin:
              names = zin.namelist()
              matches = [
                  name for name in names
                  if name == "accupdator-manager.js"
                  or name.endswith("/accupdator-manager.js")
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one accupdator-manager.js, found: {matches}"
                  )

              target = matches[0]
              js = zin.read(target).decode("utf-8")

              pos = js.find(marker)
              if pos >= 0:
                  js = js[:pos].rstrip()

              js += "\n\n" + patch + "\n"

              Path("/tmp/accupdator-manager.js").write_text(
                  js,
                  encoding="utf-8"
              )

              with ZipFile(tmp_zip, "w") as zout:
                  for info in zin.infolist():
                      payload = (
                          js.encode("utf-8")
                          if info.filename == target
                          else zin.read(info.filename)
                      )
                      zout.writestr(info, payload)

          tmp_zip.replace(zip_path)
          print("Modified:", target)
          PY

      - name: Validate JavaScript syntax
        run: node --check /tmp/accupdator-manager.js

      - name: Commit patched ZIP
        shell: bash
        run: |
          if git diff --quiet -- v4.6.2.zip; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "GPT Yar Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add v4.6.2.zip
          git commit -m "Add unlimited option when editing subscription expiry"
          git push
