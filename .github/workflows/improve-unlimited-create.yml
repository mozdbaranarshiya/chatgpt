name: Improve unlimited subscriber creation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/improve-unlimited-create.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch extension ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re

          zip_path = Path("v4.6.2.zip")
          tmp_zip = Path("v4.6.2.zip.tmp")
          js_check = Path("/tmp/accupdator-manager.js")

          JS_MARKER = "/* === GPTYAR unlimited subscription v3 === */"
          OLD_MARKER = "/* === Unlimited subscription option patch (OpenAI-assisted) === */"
          CSS_MARKER = "/* === GPTYAR unlimited subscription UI v3 === */"

          js_patch = r'''
          /* === GPTYAR unlimited subscription v3 === */
          ;(() => {
            const UNLIMITED_ID = 'newUserUnlimited';
            const UNLIMITED_ROW_ID = 'newUserUnlimitedRow';
            const UNLIMITED_STATUS_ID = 'newUserUnlimitedStatus';

            const getExpiryElement = manager =>
              DOMManager.getElement(manager.ELEMENT_IDS.NEW_USER_EXPIRY);

            const getCalendarContainer = manager => {
              const calendar =
                DOMManager.getElement(manager.ELEMENT_IDS.NEW_USER_CALENDAR);

              return calendar
                ? calendar.closest('.subscriber-calendar-container')
                : null;
            };

            const isUnlimitedSelected = () => {
              const input = document.getElementById(UNLIMITED_ID);
              return Boolean(input && input.checked);
            };

            const extractApiMessage = error => {
              const raw =
                error && error.message
                  ? String(error.message)
                  : String(error || 'خطای نامشخص');

              const jsonMatch = raw.match(/(\{[\s\S]*\})\s*$/);

              if (jsonMatch) {
                try {
                  const parsed = JSON.parse(jsonMatch[1]);
                  const message =
                    parsed.message ||
                    parsed.error ||
                    parsed.detail ||
                    parsed.errors;

                  if (message) {
                    return typeof message === 'string'
                      ? message
                      : JSON.stringify(message);
                  }
                } catch (_) {}
              }

              return raw
                .replace(/^API request failed\s*\([^)]*\):?\s*/i, '')
                .trim();
            };

            const setUnlimitedStatus = enabled => {
              const status = document.getElementById(UNLIMITED_STATUS_ID);

              if (!status) return;

              status.textContent = enabled ? 'فعال' : 'غیرفعال';
              status.classList.toggle('active', enabled);
            };

            const syncUnlimitedUI = manager => {
              const unlimited = isUnlimitedSelected();
              const expiry = getExpiryElement(manager);
              const calendarContainer = getCalendarContainer(manager);

              setUnlimitedStatus(unlimited);

              if (calendarContainer) {
                calendarContainer.classList.toggle(
                  'new-user-calendar-hidden',
                  unlimited
                );
              }

              if (!expiry) return;

              if (unlimited) {
                expiry.textContent = 'نامحدود';
                expiry.classList.add('selected', 'new-user-expiry-unlimited');
              } else {
                expiry.classList.remove('new-user-expiry-unlimited');

                if (manager._newUserExpiryDate) {
                  expiry.textContent =
                    manager._formatPersianDate(manager._newUserExpiryDate);
                  expiry.classList.add('selected');
                } else {
                  expiry.textContent = 'انتخاب نشده';
                  expiry.classList.remove('selected');
                }
              }
            };

            const ensureUnlimitedControl = manager => {
              let input = document.getElementById(UNLIMITED_ID);

              if (input) return input;

              const expiry = getExpiryElement(manager);
              const expiryRow = expiry
                ? expiry.closest('.detail-row')
                : null;

              if (!expiryRow) return null;

              const row = document.createElement('div');
              row.id = UNLIMITED_ROW_ID;
              row.className = 'detail-row new-user-unlimited-row';

              row.innerHTML = `
                <div class="new-user-unlimited-copy">
                  <span class="detail-label">اشتراک نامحدود</span>
                  <span class="new-user-unlimited-hint">
                    بدون تاریخ پایان
                  </span>
                </div>

                <div class="detail-value-with-action">
                  <span
                    id="${UNLIMITED_STATUS_ID}"
                    class="detail-value new-user-unlimited-status"
                  >
                    غیرفعال
                  </span>

                  <label
                    class="admin-proxy-toggle new-user-unlimited-toggle"
                    title="فعال یا غیرفعال کردن اشتراک نامحدود"
                  >
                    <input
                      id="${UNLIMITED_ID}"
                      type="checkbox"
                      aria-label="اشتراک نامحدود"
                    >
                    <span class="toggle-slider"></span>
                  </label>
                </div>
              `;

              expiryRow.insertAdjacentElement('afterend', row);

              input = document.getElementById(UNLIMITED_ID);

              if (input) {
                input.addEventListener('change', () => {
                  syncUnlimitedUI(manager);
                  manager._updateNewUserCreateButtonState();
                });
              }

              return input;
            };

            const createUnlimitedUser = async name => {
              const createUrl =
                CONFIG.API_SERVER + '/accupdator/subscribers/create';

              const updateUrl =
                CONFIG.API_SERVER + '/accupdator/subscribers/update';

              const deleteUrl =
                CONFIG.API_SERVER + '/accupdator/subscribers/delete';

              let directError = null;

              // First try the natural nullable representation used by
              // existing unlimited subscriptions.
              try {
                return await AccupdatorAPI._request(
                  createUrl,
                  'POST',
                  {
                    name,
                    expiresAt: null
                  }
                );
              } catch (error) {
                directError = error;
              }

              // Some server versions require a date during creation.
              // In that case create a temporary dated subscription, then
              // immediately convert it to unlimited with expiresAt: null.
              const temporaryExpiry = new Date();
              temporaryExpiry.setDate(
                temporaryExpiry.getDate() + 1
              );

              let created;

              try {
                created = await AccupdatorAPI._request(
                  createUrl,
                  'POST',
                  {
                    name,
                    expiresAt: temporaryExpiry.toISOString()
                  }
                );
              } catch (createError) {
                const first = extractApiMessage(directError);
                const second = extractApiMessage(createError);

                throw new Error(
                  second ||
                  first ||
                  'سرور درخواست ایجاد کاربر را نپذیرفت'
                );
              }

              const subscriptionId =
                created &&
                (
                  created.subscriptionId ||
                  created.subscription_id ||
                  created.id
                );

              if (!subscriptionId) {
                throw new Error(
                  'کاربر ایجاد شد اما شناسه اشتراک از سرور دریافت نشد'
                );
              }

              try {
                await AccupdatorAPI._request(
                  updateUrl,
                  'PATCH',
                  {
                    subscriptionId,
                    expiresAt: null
                  }
                );
              } catch (updateError) {
                // Roll back the temporary dated user so a failed unlimited
                // conversion does not leave an unintended subscription.
                try {
                  await AccupdatorAPI._request(
                    deleteUrl,
                    'DELETE',
                    { subscriptionId }
                  );
                } catch (rollbackError) {
                  globalThis.__GPTYAR_DEV_LOG__?.(
                    '[AccupdatorManager] Unlimited rollback failed:',
                    rollbackError
                  );
                }

                throw new Error(
                  extractApiMessage(updateError) ||
                  'سرور تبدیل اشتراک به نامحدود را نپذیرفت'
                );
              }

              return {
                ...created,
                expiresAt: null
              };
            };

            const originalSetup =
              AccupdatorManager._setupNewUserMenuEventListeners;

            AccupdatorManager._setupNewUserMenuEventListeners =
              function () {
                originalSetup.call(this);
                ensureUnlimitedControl(this);
                syncUnlimitedUI(this);
              };

            const originalReset =
              AccupdatorManager._resetNewUserForm;

            AccupdatorManager._resetNewUserForm =
              function () {
                originalReset.call(this);

                const input =
                  ensureUnlimitedControl(this);

                if (input) {
                  input.checked = false;
                }

                syncUnlimitedUI(this);
                this._updateNewUserCreateButtonState();
              };

            AccupdatorManager._updateNewUserCreateButtonState =
              function () {
                const nameInput =
                  DOMManager.getElement(
                    this.ELEMENT_IDS.NEW_USER_NAME_INPUT
                  );

                const createButton =
                  DOMManager.getElement(
                    this.ELEMENT_IDS.NEW_USER_CREATE_BTN
                  );

                if (!nameInput || !createButton) return;

                const hasName =
                  nameInput.value.trim().length > 0;

                const hasExpiry =
                  this._newUserExpiryDate !== null;

                createButton.disabled =
                  !(
                    hasName &&
                    (
                      isUnlimitedSelected() ||
                      hasExpiry
                    )
                  );
              };

            AccupdatorManager._handleCreateNewUser =
              async function () {
                const nameInput =
                  DOMManager.getElement(
                    this.ELEMENT_IDS.NEW_USER_NAME_INPUT
                  );

                const createButton =
                  DOMManager.getElement(
                    this.ELEMENT_IDS.NEW_USER_CREATE_BTN
                  );

                const unlimited =
                  isUnlimitedSelected();

                if (!nameInput) return;

                const name =
                  nameInput.value.trim();

                if (!name) return;

                if (
                  !unlimited &&
                  !this._newUserExpiryDate
                ) {
                  return;
                }

                try {
                  this._setButtonLoading(
                    createButton,
                    true
                  );

                  if (unlimited) {
                    await createUnlimitedUser(name);

                    NotificationManager.showSuccess(
                      'کاربر نامحدود با موفقیت ایجاد شد'
                    );

                    this._hideNewUserMenu();

                    await this._loadSubscribers();
                    await this.refreshAccountInfo();

                    return;
                  }

                  const createdUser =
                    await this.createNewUser(
                      name,
                      this._newUserExpiryDate
                    );

                  NotificationManager.showSuccess(
                    'کاربر جدید با موفقیت ایجاد شد'
                  );

                  const menu =
                    DOMManager.getElement(
                      this.ELEMENT_IDS.NEW_USER_MENU
                    );

                  if (menu) {
                    menu.classList.remove('active');
                  }

                  this._showCreatedUserDetails(
                    createdUser
                  );

                  await this._loadSubscribers();
                  await this.refreshAccountInfo();

                } catch (error) {
                  const message =
                    extractApiMessage(error);

                  globalThis.__GPTYAR_DEV_LOG__?.(
                    '[AccupdatorManager] Error creating new user:',
                    error
                  );

                  NotificationManager.showError(
                    'خطا در ایجاد کاربر: ' +
                    (
                      message.length > 180
                        ? message.slice(0, 180) + '…'
                        : message
                    )
                  );
                } finally {
                  this._setButtonLoading(
                    createButton,
                    false
                  );

                  this._updateNewUserCreateButtonState();
                }
              };
          })();
          '''

          css_patch = r'''
          /* === GPTYAR unlimited subscription UI v3 === */
          .new-user-unlimited-row {
            min-height: 48px;
            gap: 12px;
          }

          .new-user-unlimited-copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3px;
          }

          .new-user-unlimited-hint {
            color: #6c7a89;
            font-size: 10px;
            line-height: 1.4;
          }

          .new-user-unlimited-status {
            min-width: 46px;
            text-align: left;
            color: #8892a0;
            transition: color 0.25s ease;
          }

          .new-user-unlimited-status.active {
            color: #4ade80;
          }

          .new-user-unlimited-toggle {
            margin: 0;
            flex-shrink: 0;
          }

          .new-user-expiry-unlimited {
            color: #fbbf24 !important;
          }

          .new-user-calendar-hidden {
            display: none !important;
          }
          '''

          if not zip_path.exists():
              raise SystemExit("v4.6.2.zip not found")

          with ZipFile(zip_path, "r") as zin:
              js_candidates = [
                  name for name in zin.namelist()
                  if name == "accupdator-manager.js"
                  or name.endswith("/accupdator-manager.js")
              ]

              css_candidates = [
                  name for name in zin.namelist()
                  if name == "assets/styles.css"
                  or name.endswith("/assets/styles.css")
              ]

              if len(js_candidates) != 1:
                  raise SystemExit(
                      f"Expected one accupdator-manager.js, found: {js_candidates}"
                  )

              if len(css_candidates) != 1:
                  raise SystemExit(
                      f"Expected one assets/styles.css, found: {css_candidates}"
                  )

              js_name = js_candidates[0]
              css_name = css_candidates[0]

              js = zin.read(js_name).decode("utf-8")
              css = zin.read(css_name).decode("utf-8")

              # Remove all earlier experimental unlimited patches by restoring
              # the original JS prefix before the first patch marker.
              cut_positions = [
                  pos for pos in (
                      js.find(OLD_MARKER),
                      js.find(JS_MARKER),
                  )
                  if pos >= 0
              ]

              if cut_positions:
                  js = js[:min(cut_positions)].rstrip()

              js = js + "\n\n" + js_patch.strip() + "\n"

              # Replace our UI style block cleanly on reruns.
              css_pos = css.find(CSS_MARKER)
              if css_pos >= 0:
                  css = css[:css_pos].rstrip()

              css = css + "\n\n" + css_patch.strip() + "\n"

              js_check.write_text(js, encoding="utf-8")

              with ZipFile(tmp_zip, "w") as zout:
                  for info in zin.infolist():
                      if info.filename == js_name:
                          payload = js.encode("utf-8")
                      elif info.filename == css_name:
                          payload = css.encode("utf-8")
                      else:
                          payload = zin.read(info.filename)

                      zout.writestr(info, payload)

          tmp_zip.replace(zip_path)

          print("Modified extension files:")
          print(js_name)
          print(css_name)
          PY

      - name: Validate JavaScript syntax
        run: node --check /tmp/accupdator-manager.js

      - name: Commit updated ZIP
        shell: bash
        run: |
          git config user.name "GPT Yar Patch Bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- v4.6.2.zip; then
            echo "No changes to commit."
            exit 0
          fi

          git add v4.6.2.zip
          git commit -m "Improve unlimited subscriber creation and UI"
          git push
