name: Build GPT Yar v4.6.3 Commerce Admin

on:
  push:
    branches:
      - feature/commerce-admin-v4.6.3
    paths:
      - "patches/v4.6.3/**"
      - "scripts/build_v463.py"
      - ".github/workflows/build-v4.6.3.yml"
      - "v4.6.2.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build extension ZIP
        run: python scripts/build_v463.py

      - name: Commit generated ZIP
        shell: bash
        run: |
          if git diff --quiet -- v4.6.3-commerce-admin.zip && git ls-files --error-unmatch v4.6.3-commerce-admin.zip >/dev/null 2>&1; then
            echo "Generated ZIP is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4.6.3-commerce-admin.zip
          git commit -m "Build v4.6.3 commerce admin extension"
          git push
