name: Fix unlimited subscriptions v4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-unlimited-v4.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch extension archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          zip_path = Path("v4.6.2.zip")
          tmp_zip = Path("v4.6.2.zip.tmp")

          acc_patch = Path(".tmp/unlimited-acc-v4.js").read_text(encoding="utf-8").strip()
          popup_patch = Path(".tmp/unlimited-popup-v4.js").read_text(encoding="utf-8").strip()
          css_patch = Path(".tmp/unlimited-v4.css").read_text(encoding="utf-8").strip()

          acc_markers = [
              "/* === Unlimited subscription option patch (OpenAI-assisted) === */",
              "/* === GPTYAR unlimited API null fix v2 === */",
              "/* === GPTYAR unlimited subscription v3 === */",
              "/* === GPTYAR unlimited subscription v4 === */",
          ]
          popup_marker = "/* === GPTYAR unlimited display v4 === */"
          css_markers = [
              "/* === GPTYAR unlimited subscription UI v3 === */",
              "/* === GPTYAR unlimited subscription UI v4 === */",
          ]

          if not zip_path.exists():
              raise SystemExit("v4.6.2.zip not found")

          with ZipFile(zip_path, "r") as zin:
              names = zin.namelist()

              def one_ending(suffix):
                  matches = [
                      name for name in names
                      if name == suffix or name.endswith("/" + suffix)
                  ]
                  if len(matches) != 1:
                      raise SystemExit(
                          f"Expected exactly one {suffix}, found: {matches}"
                      )
                  return matches[0]

              acc_name = one_ending("accupdator-manager.js")
              popup_name = one_ending("popup.js")
              css_name = one_ending("assets/styles.css")

              acc = zin.read(acc_name).decode("utf-8")
              popup = zin.read(popup_name).decode("utf-8")
              css = zin.read(css_name).decode("utf-8")

              acc_positions = [
                  acc.find(marker)
                  for marker in acc_markers
                  if acc.find(marker) >= 0
              ]
              if acc_positions:
                  acc = acc[:min(acc_positions)].rstrip()
              acc += "\n\n" + acc_patch + "\n"

              popup_pos = popup.find(popup_marker)
              if popup_pos >= 0:
                  popup = popup[:popup_pos].rstrip()
              popup += "\n\n" + popup_patch + "\n"

              css_positions = [
                  css.find(marker)
                  for marker in css_markers
                  if css.find(marker) >= 0
              ]
              if css_positions:
                  css = css[:min(css_positions)].rstrip()
              css += "\n\n" + css_patch + "\n"

              Path("/tmp/accupdator-manager.js").write_text(
                  acc, encoding="utf-8"
              )
              Path("/tmp/popup.js").write_text(
                  popup, encoding="utf-8"
              )

              with ZipFile(tmp_zip, "w") as zout:
                  for info in zin.infolist():
                      if info.filename == acc_name:
                          payload = acc.encode("utf-8")
                      elif info.filename == popup_name:
                          payload = popup.encode("utf-8")
                      elif info.filename == css_name:
                          payload = css.encode("utf-8")
                      else:
                          payload = zin.read(info.filename)
                      zout.writestr(info, payload)

          tmp_zip.replace(zip_path)

          print("Modified extension files:")
          print(acc_name)
          print(popup_name)
          print(css_name)
          PY

      - name: Validate JavaScript
        run: |
          node --check /tmp/accupdator-manager.js
          node --check /tmp/popup.js

      - name: Commit patched ZIP
        shell: bash
        run: |
          if git diff --quiet -- v4.6.2.zip; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "GPT Yar Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add v4.6.2.zip
          git commit -m "Use server-compatible unlimited expiry and improve UI"
          git push
